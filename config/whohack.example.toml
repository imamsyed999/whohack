# whohack service configuration (example).
#
# Default location:
#   Windows  %ProgramData%\whohack\config.toml
#   Linux    /etc/whohack/config.toml
#   macOS    /Library/Application Support/whohack/config.toml
#
# Every key is optional; omitted keys use the defaults shown here. Unknown keys
# are rejected, so a typo is reported instead of silently ignored. Relative
# paths are resolved against the directory containing this file.
#
# `whohack-service --print-default-config` prints the defaults for your OS;
# `whohack-service --config FILE --check-config` validates a file.

# Response mode:
# Response must also be explicitly enabled below. Without it the service uses
# monitor mode and rejects unsupported mode selections.
#   monitor  log and notify only
#   prompt   block network on suspicion, ask before anything stronger (default)
#   auto     apply the strongest policy action automatically, notify after
mode = "prompt"

[paths]
# Where the event database and other state live.
# Defaults: Windows %ProgramData%\whohack\data, Linux /var/lib/whohack,
#           macOS /Library/Application Support/whohack/data
data_dir = "data"
# Defaults: Windows %ProgramData%\whohack\logs, Linux /var/log/whohack,
#           macOS /Library/Logs/whohack
log_dir = "logs"
# Detection content: yara/*.yar, Tier 0 rules, behavior profiles.
# Defaults: Windows %ProgramData%\whohack\rules, Linux /etc/whohack/rules,
#           macOS /Library/Application Support/whohack/rules
rules_dir = "rules"

[storage]
# SQLite database file, relative to data_dir (or absolute).
db_file = "vigil.db"
# How long raw events, connections and DNS records are kept (1-3650 days).
event_retention_days = 30

[logging]
# A tracing filter directive, e.g. "info" or "info,whohack_core=debug".
# The RUST_LOG environment variable overrides this at runtime.
level = "info"
# text | json
format = "text"
# Also write a daily-rolling log file in log_dir.
to_file = true

[collect]
sysmon = false # Read an existing Windows Sysmon channel, if available.
file_roots = [] # Linux: explicit sensitive/document directories for fanotify.
# auto   native sources (eBPF on Linux, ETW on Windows) when privileged, else polling
# poll   polling only (works unprivileged; may miss very short-lived activity)
# native native only; the service refuses to start if unavailable
backend = "auto"
# Polling interval for polling collectors (100-60000 ms).
poll_interval_ms = 1000
# Report connections to 127.0.0.0/8 and ::1 (normally noise).
include_loopback = false
# Watch DNS answers so connections can be attributed to domain names.
dns = true

[sensitive]
# Extra locations on top of the built-in per-OS table (browser credential stores,
# These classify supplied events; live sensitive-file collectors are not implemented.
# ~/.ssh, keychains, wallets, persistence locations). A path may be a directory
# (covers its contents) or a file.
# Classes: browser_passwords, keychain, ssh_keys, crypto_wallet, documents, other
[sensitive.extra_paths]
# browser_passwords = ["/srv/shared-profiles"]
# Kinds: run_key, startup_folder, scheduled_task, service, launch_agent,
#        login_item, cron, systemd_unit, shell_rc, autostart
[sensitive.extra_persistence]
# autostart = ["/etc/xdg/autostart"]

[ipc]
# Local endpoint the tray UI connects to (authenticated with a per-session token
# written to <data_dir>/ipc.token).
# Defaults: Linux /run/whohack/whohack.sock, macOS /var/run/whohack/whohack.sock,
#           Windows \\.\pipe\whohack
# endpoint = "/run/whohack/whohack.sock"
[response]
# Explicit opt-in. Windows requires elevation for WFP. Preview stays monitor-only.
enabled = false
# Keep false for confirmation-based responses, even if a saved mode is Auto.
automatic = false
# Independent, reversible pause on strong downloaded-file/process evidence.
# Works without automatic firewall actions. Does not automatically delete files.
# Monitor mode, explicit trust and failed integrity checks suppress this action.
pause_downloads = false

[tier1]
# Local Tier 2 is optional: configure [decision] manifest = "model-manifest.json"
# after tools/ml/prepare_model.py has pinned its local files. Base models are
# advisory until a representative evaluation and calibration pass the gate.
# Optional local ONNX scorer: one [1,17] float input, one score in [0,1].
# Supply the exact SHA-256 from your validated model manifest.
# model = "models/tier1.onnx"
# sha256 = "64 hexadecimal characters"
