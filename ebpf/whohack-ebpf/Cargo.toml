[package]
name = "whohack-ebpf"
description = "whohack eBPF tracepoint programs (built for bpfel-unknown-none by aya-build)"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: this crate targets bpfel-unknown-none with a nightly
# toolchain and must not be built as part of the main (host) workspace.
[workspace]

[dependencies]
aya-ebpf = { version = "0.2.1", default-features = false }
whohack-ebpf-common = { path = "../../crates/whohack-ebpf-common" }

[[bin]]
name = "whohack-ebpf"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 2
codegen-units = 1
strip = false
