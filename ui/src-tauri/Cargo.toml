[package]
name = "whohack-tray"
description = "whohack tray UI: alerts, timeline, allowlist, and mode switch"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Separate workspace: building the UI needs webview system libraries that the
# core service build does not.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
whohack-core = { path = "../../crates/whohack-core", default-features = false }
whohack-ipc = { path = "../../crates/whohack-ipc" }

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
