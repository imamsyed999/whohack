[package]
name = "whohack-respond"
description = "Identity-checked local response and recoverable quarantine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
whohack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
