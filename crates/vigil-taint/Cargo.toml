[package]
name = "vigil-taint"
description = "Vigil taint: download origin, hashing, code signatures, YARA scanning, and process lineage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["yara"]
# YARA scanning with yara-x (pulls in wasmtime; disable for a lighter build).
yara = ["dep:yara-x"]

[dependencies]
lru.workspace = true
md-5.workspace = true
sha2.workspace = true
tracing.workspace = true
vigil-core.workspace = true
yara-x = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
