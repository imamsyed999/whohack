[workspace]
resolver = "3"
members = ["crates/*"]

# Keep ordinary development/test builds from accumulating large symbol and
# incremental caches. Opt in to symbols when investigating a debugger issue.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
whohack-core = { path = "crates/whohack-core", default-features = false }
whohack-collect = { path = "crates/whohack-collect" }
whohack-ebpf-common = { path = "crates/whohack-ebpf-common" }
whohack-intel = { path = "crates/whohack-intel" }
whohack-taint = { path = "crates/whohack-taint" }
whohack-ipc = { path = "crates/whohack-ipc" }
whohack-decide = { path = "crates/whohack-decide" }
whohack-tags = { path = "crates/whohack-tags" }
whohack-detect = { path = "crates/whohack-detect" }
whohack-respond = { path = "crates/whohack-respond" }

anyhow = "1.0.104"
async-trait = "0.1.92"
aya = { version = "0.14.0", default-features = false }
ferrisetw = "1.2.0"
libc = "0.2"
lru = "0.18.5"
md-5 = "0.11.0"
rand = "0.9"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tract-onnx = { version = "0.23.8", default-features = false }
windows-service = "0.8.1"
windows-sys = "0.61.2"
yara-x = { version = "1.21.0", default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "console-module",
    "dotnet-module",
    "elf-module",
    "hash-module",
    "macho-module",
    "math-module",
    "pe-module",
    "string-module",
    "time-module",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
